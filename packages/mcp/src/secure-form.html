<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>安全表单</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      main {
        max-width: 560px;
        margin: auto;
      }
      h1 {
        font-size: 18px;
        margin: 8px 0;
      }
      #origin {
        overflow-wrap: anywhere;
      }
      label {
        display: grid;
        gap: 6px;
        margin: 16px 0;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 10px;
        border: 1px solid #888;
        border-radius: 8px;
      }
      input,
      select {
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        cursor: pointer;
        margin: 4px 4px 4px 0;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 16px 0;
      }
      legend {
        font-weight: 600;
      }
      small,
      #summary {
        opacity: 0.75;
      }
      #status {
        margin: 12px 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="origin"></div>
      <h1 id="title">安全表单</h1>
      <div id="summary"></div>
      <div id="status" role="status" aria-live="polite">等待安全表单请求…</div>
      <button id="open" type="button" hidden>打开安全表单</button>
      <form id="secure-form" hidden autocomplete="off">
        <button id="back" type="button">返回并清除未提交内容</button>
        <button id="fullscreen" type="button" hidden>全屏填写</button>
        <div id="fields"></div>
        <p id="delivery"></p>
        <button id="submit" type="submit">填入网页</button>
      </form>
      <button id="cancel" type="button" hidden>取消请求</button>
      <button id="check" type="button" hidden>检查状态</button>
      <button id="resume" type="button" hidden>继续任务</button>
      <p id="next-action"></p>
      <p id="notice" role="status"></p>
      <small
        >请核对站点。填写内容通过私密通道交给该网页，不作为聊天消息或普通工具结果发送给模型。</small
      >
      <details>
        <summary>处理方与保护范围</summary>
        <p>
          宿主、CUA
          服务、浏览器和目标网站会处理填写内容。保护依赖可信宿主的私密路由与观察限制；不承诺对同权限恶意代码的隔离。不保存表单草稿。
        </p>
      </details>
    </main>
    <script type="module">
      __APP_SCRIPT__;
    </script>
  </body>
</html>
