# Codex / its stdio executor must run INSIDE the Ubuntu sandbox.
[mcp_servers.cua]
command = "/opt/cua/runtime/node"
args = ["/opt/cua/deploy/sandbox/start.mjs"]
cwd = "/opt/cua"
startup_timeout_sec = 60
tool_timeout_sec = 45
